name: CI - Build and Validate Frontend

on:
  push:
    branches:
      - develop
      - release
      - production
  pull_request:
    branches:
      - develop
      - release
      - production

jobs:
  frontend-ci:
    name: HTML Validation and Docker Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install HTML Validator
        run: |
          npm install -g htmlhint

      - name: Validate HTML
        run: |
          htmlhint src/frontend/index.html

      - name: Validate CSS File Exists
        run: |
          test -f src/frontend/style.css

      - name: Build Docker Image
        run: |
          docker build -t cloudshop-frontend:ci .