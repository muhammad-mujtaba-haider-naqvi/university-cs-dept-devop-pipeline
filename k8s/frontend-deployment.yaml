apiVersion: apps/v1
kind: Deployment

metadata:
  name: cloudshop-frontend

spec:
  replicas: 2

  selector:
    matchLabels:
      app: cloudshop-frontend

  strategy:
    type: RollingUpdate

  template:
    metadata:
      labels:
        app: cloudshop-frontend

    spec:
      containers:
        - name: cloudshop-frontend
          image: mujtaba72/cloudshop-frontend:v1
          ports:
            - containerPort: 80

---

apiVersion: v1
kind: Service

metadata:
  name: cloudshop-service

spec:
  selector:
    app: cloudshop-frontend

  ports:
    - protocol: TCP
      port: 80
      targetPort: 80

  type: LoadBalancer