name: CI - Build and Validate Frontend

on:
  push:
    branches:
      - develop
      - release
      - production

  pull_request:
    branches:
      - develop
      - release
      - production

jobs:
  frontend-ci:
    name: HTML CSS Linting and Docker Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install HTML and CSS Linters
        run: |
          npm install -g htmlhint stylelint

      - name: Run HTML Lint
        run: |
          htmlhint src/frontend/index.html

      - name: Run CSS Lint
        run: |
          stylelint "src/frontend/**/*.css" --allow-empty-input --fix || true

      - name: Build Docker Image
        run: |
          docker build -t cloudshop-frontend:ci .